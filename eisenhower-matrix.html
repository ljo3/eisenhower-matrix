<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eisenhower Matrix</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9f8f6;
    --text: #1a1a1a;
    --subtitle: #888;
    --border: #d0cec8;
    --hover-bg: #f0ede8;
    --axis-label: #aaa;
    --task-border: #ddd;
    --task-border-focus: #aaa;
    --placeholder: #bbb;
    --add-btn: #aaa;
    --add-btn-hover: #666;
    --date-color: #bbb;
  }

  [data-theme="dark"] {
    --bg: #18181a;
    --text: #eee;
    --subtitle: #999;
    --border: #3a3a3c;
    --hover-bg: #28282a;
    --axis-label: #777;
    --task-border: #3a3a3c;
    --task-border-focus: #666;
    --placeholder: #555;
    --add-btn: #777;
    --add-btn-hover: #bbb;
    --date-color: #555;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 24px 16px;
    color: var(--text);
    transition: background 0.2s, color 0.2s;
  }

  h1 {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 12px;
    color: var(--subtitle);
    margin-bottom: 20px;
  }

  .theme-toggle-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 0.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: background 0.15s;
    z-index: 10;
  }
  .theme-toggle-btn:hover { background: var(--hover-bg); }

  .header-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .reset-btn {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--subtitle);
    cursor: pointer;
    padding: 5px 14px;
    font-family: inherit;
    transition: background 0.15s;
  }
  .reset-btn:hover { background: var(--hover-bg); }
  .reset-btn.confirming { border-color: #e05252; color: #a02020; background: #fdf0f0; }
  .reset-btn.confirming:hover { background: #fce0e0; }

  .axis-wrap {
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: 8px;
  }

  .y-axis-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px;
    color: var(--axis-label);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .right-col { display: flex; flex-direction: column; gap: 6px; }

  .x-axis-labels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 2px;
  }

  .x-label {
    font-size: 10px;
    color: var(--axis-label);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .quadrant {
    border-radius: 12px;
    border: 0.5px solid transparent;
    padding: 14px 15px;
    min-height: 210px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .q-do       { background: #fdf0f0; border-color: #f5c4c4; --accent: #e05252; }
  .q-schedule { background: #eef6e4; border-color: #c3df9a; --accent: #639922; }
  .q-delegate { background: #fdf4e4; border-color: #f5cf87; --accent: #c07c10; }
  .q-eliminate{ background: #f3f2ee; border-color: #d5d3cc; --accent: #888; }

  [data-theme="dark"] .q-do       { background: #3a2222; border-color: #5a2c2c; }
  [data-theme="dark"] .q-schedule { background: #233222; border-color: #3a5530; }
  [data-theme="dark"] .q-delegate { background: #352c1c; border-color: #5a4a26; }
  [data-theme="dark"] .q-eliminate{ background: #2a2a29; border-color: #45433f; }

  .q-header { display: flex; align-items: center; gap: 10px; }

  .q-icon {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
    color: #fff;
  }
  .q-do .q-icon       { background: #e05252; }
  .q-schedule .q-icon { background: #6aaa22; }
  .q-delegate .q-icon { background: #e09a20; }
  .q-eliminate .q-icon{ background: #aaa; }

  .q-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
  }
  .q-do .q-title       { color: #a02020; }
  .q-schedule .q-title { color: #3b6d11; }
  .q-delegate .q-title { color: #7a4d08; }
  .q-eliminate .q-title{ color: #555; }

  [data-theme="dark"] .q-do .q-title       { color: #f29a9a; }
  [data-theme="dark"] .q-schedule .q-title { color: #a8d97a; }
  [data-theme="dark"] .q-delegate .q-title { color: #e0b35c; }
  [data-theme="dark"] .q-eliminate .q-title{ color: #ccc; }

  .q-sub {
    font-size: 11px;
    opacity: 0.7;
  }
  .q-do .q-sub       { color: #a02020; }
  .q-schedule .q-sub { color: #3b6d11; }
  .q-delegate .q-sub { color: #7a4d08; }
  .q-eliminate .q-sub{ color: #555; }

  [data-theme="dark"] .q-do .q-sub       { color: #f29a9a; }
  [data-theme="dark"] .q-schedule .q-sub { color: #a8d97a; }
  [data-theme="dark"] .q-delegate .q-sub { color: #e0b35c; }
  [data-theme="dark"] .q-eliminate .q-sub{ color: #ccc; }

  .task-list { display: flex; flex-direction: column; gap: 5px; flex: 1; }

  .task-item { display: flex; align-items: center; gap: 8px; }

  .task-item input[type=checkbox] {
    width: 14px; height: 14px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--accent);
  }

  .task-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 0.5px solid var(--task-border);
    font-size: 13px;
    color: var(--text);
    padding: 3px 0;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .task-input::placeholder { color: var(--placeholder); }
  .task-input:focus { border-bottom-color: var(--task-border-focus); }
  .task-input.done { text-decoration: line-through; color: var(--placeholder); }

  .add-btn {
    background: none;
    border: none;
    font-size: 11px;
    color: var(--add-btn);
    cursor: pointer;
    padding: 2px 0;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
    transition: color 0.15s;
  }
  .add-btn:hover { color: var(--add-btn-hover); }

  .date-row {
    font-size: 11px;
    color: var(--date-color);
    text-align: right;
    margin-top: 4px;
  }
</style>
</head>
<body>

<button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
  <i class="ti ti-moon" id="theme-icon"></i>
</button>

<div class="header-row">
  <div>
    <h1>⚡ Eisenhower Matrix</h1>
    <div class="subtitle">Sort tasks by urgency and importance — reset daily.</div>
  </div>
  <button class="reset-btn" id="reset-btn" onclick="resetAll()">Reset all</button>
</div>

<div class="axis-wrap">
  <div class="y-axis-label">Important</div>
  <div class="right-col">
    <div class="x-axis-labels">
      <div class="x-label">Urgent</div>
      <div class="x-label">Not urgent</div>
    </div>

    <div class="grid">

      <div class="quadrant q-do">
        <div class="q-header">
          <div class="q-icon"><i class="ti ti-bolt"></i></div>
          <div>
            <div class="q-title">Do first</div>
            <div class="q-sub">Urgent &amp; important</div>
          </div>
        </div>
        <div class="task-list" id="list-do"></div>
        <button class="add-btn" onclick="addTask('do')"><i class="ti ti-plus" style="font-size:12px"></i> Add task</button>
      </div>

      <div class="quadrant q-schedule">
        <div class="q-header">
          <div class="q-icon"><i class="ti ti-calendar"></i></div>
          <div>
            <div class="q-title">Schedule</div>
            <div class="q-sub">Not urgent &amp; important</div>
          </div>
        </div>
        <div class="task-list" id="list-schedule"></div>
        <button class="add-btn" onclick="addTask('schedule')"><i class="ti ti-plus" style="font-size:12px"></i> Add task</button>
      </div>

      <div class="quadrant q-delegate">
        <div class="q-header">
          <div class="q-icon"><i class="ti ti-user-share"></i></div>
          <div>
            <div class="q-title">Delegate</div>
            <div class="q-sub">Urgent &amp; not important</div>
          </div>
        </div>
        <div class="task-list" id="list-delegate"></div>
        <button class="add-btn" onclick="addTask('delegate')"><i class="ti ti-plus" style="font-size:12px"></i> Add task</button>
      </div>

      <div class="quadrant q-eliminate">
        <div class="q-header">
          <div class="q-icon"><i class="ti ti-trash"></i></div>
          <div>
            <div class="q-title">Eliminate</div>
            <div class="q-sub">Not urgent &amp; not important</div>
          </div>
        </div>
        <div class="task-list" id="list-eliminate"></div>
        <button class="add-btn" onclick="addTask('eliminate')"><i class="ti ti-plus" style="font-size:12px"></i> Add task</button>
      </div>

    </div>

    <div class="date-row" id="date-label"></div>
  </div>
</div>

<script>
  document.getElementById('date-label').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  function getStoredTheme() {
    try { return localStorage.getItem('theme'); } catch (e) { return null; }
  }

  function setStoredTheme(theme) {
    try { localStorage.setItem('theme', theme); } catch (e) { /* storage blocked (e.g. sandboxed embed) */ }
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-icon').className = theme === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
    setStoredTheme(theme);
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }

  (function initTheme() {
    const saved = getStoredTheme();
    let preferred = 'light';
    try { preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) {}
    applyTheme(saved || preferred);
  })();

  function addTask(q, value) {
    const list = document.getElementById('list-' + q);
    const item = document.createElement('div');
    item.className = 'task-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'task-input';
    inp.placeholder = 'Add a task...';
    if (value) inp.value = value;
    cb.addEventListener('change', () => inp.classList.toggle('done', cb.checked));
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addTask(q); }
      if (e.key === 'Backspace' && inp.value === '') item.remove();
    });
    item.appendChild(cb);
    item.appendChild(inp);
    list.appendChild(item);
    if (!value) inp.focus();
  }

  function resetAll() {
    const btn = document.getElementById('reset-btn');
    if (btn.classList.contains('confirming')) {
      ['do','schedule','delegate','eliminate'].forEach(q => {
        document.getElementById('list-' + q).innerHTML = '';
        addTask(q);
      });
      btn.textContent = 'Reset all';
      btn.classList.remove('confirming');
    } else {
      btn.textContent = 'Tap again to confirm';
      btn.classList.add('confirming');
      setTimeout(() => {
        btn.textContent = 'Reset all';
        btn.classList.remove('confirming');
      }, 3000);
    }
  }

  ['do','schedule','delegate','eliminate'].forEach(q => addTask(q));
</script>

</body>
</html>
