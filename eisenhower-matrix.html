<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eisenhower Matrix</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f9f8f6;
    min-height: 100vh;
    padding: 24px 16px;
    color: #1a1a1a;
  }

  h1 {
    font-size: 17px;
    font-weight: 500;
    color: #1a1a1a;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 12px;
    color: #888;
    margin-bottom: 20px;
  }

  .header-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .reset-btn {
    background: none;
    border: 0.5px solid #d0cec8;
    border-radius: 8px;
    font-size: 12px;
    color: #888;
    cursor: pointer;
    padding: 5px 14px;
    font-family: inherit;
    transition: background 0.15s;
  }
  .reset-btn:hover { background: #f0ede8; }

  .axis-wrap {
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: 8px;
  }

  .y-axis-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px;
    color: #aaa;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .right-col { display: flex; flex-direction: column; gap: 6px; }

  .x-axis-labels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 2px;
  }

  .x-label {
    font-size: 10px;
    color: #aaa;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .quadrant {
    border-radius: 12px;
    border: 0.5px solid transparent;
    padding: 14px 15px;
    min-height: 210px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .q-do       { background: #fdf0f0; border-color: #f5c4c4; --accent: #e05252; }
  .q-schedule { background: #eef6e4; border-color: #c3df9a; --accent: #639922; }
  .q-delegate { background: #fdf4e4; border-color: #f5cf87; --accent: #c07c10; }
  .q-eliminate{ background: #f3f2ee; border-color: #d5d3cc; --accent: #888; }

  .q-header { display: flex; align-items: center; gap: 10px; }

  .q-icon {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
    color: #fff;
  }
  .q-do .q-icon       { background: #e05252; }
  .q-schedule .q-icon { background: #6aaa22; }
  .q-delegate .q-icon { background: #e09a20; }
  .q-eliminate .q-icon{ background: #aaa; }

  .q-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
  }
  .q-do .q-title       { color: #a02020; }
  .q-schedule .q-title { color: #3b6d11; }
  .q-delegate .q-title { color: #7a4d08; }
  .q-eliminate .q-title{ color: #555; }

  .q-sub {
    font-size: 11px;
    opacity: 0.7;
  }
  .q-do .q-sub       { color: #a02020; }
  .q-schedule .q-sub { color: #3b6d11; }
  .q-delegate .q-sub { color: #7a4d08; }
  .q-eliminate .q-sub{ color: #555; }

  .task-list { display: flex; flex-direction: column; gap: 5px; flex: 1; }

  .task-item { display: flex; align-items: center; gap: 8px; }

  .task-item input[type=checkbox] {
    width: 14px; height: 14px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--accent);
  }

  .task-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 0.5px solid #ddd;
    font-size: 13px;
    color: #1a1a1a;
    padding: 3px 0;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .task-input::placeholder { color: #bbb; }
  .task-input:focus { border-bottom-color: #aaa; }
  .task-input.done { text-decoration: line-through; color: #bbb; }

  .add-btn {
    background: none;
    border: none;
    font-size: 11px;
    color: #aaa;
    cursor: pointer;
    padding: 2px 0;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
    transition: color 0.15s;
  }
  .add-btn:hover { color: #666; }

  .date-row {
    font-size: 11px;
    color: #bbb;
    text-align: right;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="header-row">
  <div>
    <h1>⚡ Eisenhower Matrix</h1>
    <div class="subtitle">Sort tasks by urgency and importance — reset daily.</div>
  </div>
  <button class="reset-btn" onclick="resetAll()">Reset all</button>
</div>

<div class="axis-wrap">
  <div class="y-axis-label">Important</div>
  <div class="right-col">
    <div class="x-axis-labels">
      <div class="x-label">Urgent</div>
      <div class="x-label">Not urgent</div>
    </div>

    <div class="grid">

      <div class="quadrant q-do">
        <div class="q-header">
          <div class="q-icon"><i class="ti ti-bolt"></i></div>
          <div>
            <div class="q-title">Do first</div>
            <div class="q-sub">Urgent &amp; important</div>
          </div>
        </div>
        <div class="task-list" id="list-do"></div>
        <button class="add-btn" onclick="addTask('do')"><i class="ti ti-plus" style="font-size:12px"></i> Add task</button>
      </div>

      <div class="quadrant q-schedule">
        <div class="q-header">
          <div class="q-icon"><i class="ti ti-calendar"></i></div>
          <div>
            <div class="q-title">Schedule</div>
            <div class="q-sub">Not urgent &amp; important</div>
          </div>
        </div>
        <div class="task-list" id="list-schedule"></div>
        <button class="add-btn" onclick="addTask('schedule')"><i class="ti ti-plus" style="font-size:12px"></i> Add task</button>
      </div>

      <div class="quadrant q-delegate">
        <div class="q-header">
          <div class="q-icon"><i class="ti ti-user-share"></i></div>
          <div>
            <div class="q-title">Delegate</div>
            <div class="q-sub">Urgent &amp; not important</div>
          </div>
        </div>
        <div class="task-list" id="list-delegate"></div>
        <button class="add-btn" onclick="addTask('delegate')"><i class="ti ti-plus" style="font-size:12px"></i> Add task</button>
      </div>

      <div class="quadrant q-eliminate">
        <div class="q-header">
          <div class="q-icon"><i class="ti ti-trash"></i></div>
          <div>
            <div class="q-title">Eliminate</div>
            <div class="q-sub">Not urgent &amp; not important</div>
          </div>
        </div>
        <div class="task-list" id="list-eliminate"></div>
        <button class="add-btn" onclick="addTask('eliminate')"><i class="ti ti-plus" style="font-size:12px"></i> Add task</button>
      </div>

    </div>

    <div class="date-row" id="date-label"></div>
  </div>
</div>

<script>
  document.getElementById('date-label').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  function addTask(q, value) {
    const list = document.getElementById('list-' + q);
    const item = document.createElement('div');
    item.className = 'task-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'task-input';
    inp.placeholder = 'Add a task...';
    if (value) inp.value = value;
    cb.addEventListener('change', () => inp.classList.toggle('done', cb.checked));
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addTask(q); }
      if (e.key === 'Backspace' && inp.value === '') item.remove();
    });
    item.appendChild(cb);
    item.appendChild(inp);
    list.appendChild(item);
    if (!value) inp.focus();
  }

  function resetAll() {
    if (!confirm('Clear all tasks?')) return;
    ['do','schedule','delegate','eliminate'].forEach(q => {
      document.getElementById('list-' + q).innerHTML = '';
      addTask(q);
    });
  }

  ['do','schedule','delegate','eliminate'].forEach(q => addTask(q));
</script>

</body>
</html>
